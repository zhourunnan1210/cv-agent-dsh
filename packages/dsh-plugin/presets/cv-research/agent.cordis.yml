# The `cv-research` agent preset: the standard coding agent, plus the
# cv-research project-state framework.
#
# Copied from `standard` (user root, not the shipped install) and extended with
# one group: the `projectState` service (cv-agent-dsh/state) and its tool row
# (cv-agent-dsh/state-tools). Service plane placement follows the frozen
# decision in docs/勘误 §4.4.1 — projectState is project-private state and
# therefore lives behind an `isolate` realm here; both the provider and its
# consumer sit inside the same group.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# The orchestrator persona stays thin on purpose: the project-state prompt
# section (registered by cv-agent-dsh/state, order 125) injects the live
# stage/mode/gate context, so nothing stage-specific is duplicated here.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are the CV Research Orchestrator running on the {{model}} model.
      You drive one research project's big loop (knowledge building → idea
      generation → idea scoring → experiment → writing) using the cv-research
      state framework. Read the [cv-research 项目状态] prompt section every
      step: it carries the live stage, ABC mode, and any pending gate. Use
      cvagent_state_* / cvagent_mode_set / cvagent_gate_resolve to advance the
      machine. In confirm mode always ask the user via ask_user_question before
      resolving a gate. Heavy context work (full-text reading, code execution,
      experiment monitoring) belongs to delegated subagents with a narrow
      toolFilter — never in your own context.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── cv-research project plane (single isolate realm) ─────────────────────────
#
# Service-plane decision frozen in docs/勘误 §4.4.1 (2026-09-15): projectState and
# `kb` are both **per-project private state**, so they live here — behind an
# isolate realm — rather than in the host composition.
#
# ⚠️ 2026-09-17 起两者合为**一个 group / 一个 realm**（P3-4 需要）：
# `projectState.advance` 的阶段判据必须读知识库的**真实数字**（论文/解析/提取/四库
# 条目数），而事实只能由同 realm 的服务解析。若仍分两个 realm，状态工具读不到 kb，
# 判据就只能退化成"模型自报数字"——那等于没有门控。
#
# 同一 group 还有一个附带好处：`ideaScore` 与 `kb` 天然同 realm（它 inject kb 读同一实例），
# 不会出现"同一 DB 两个连接、两份缓存"的语义分叉。
#
# MinerU 的跨项目额度账本**刻意不在这里**：它是跨项目共享资源，住在宿主组合里
# （cv-agent-dsh 的 cordis.patch.yml）。
- id: cvagent-project-group
  name: cordis:group
  group: true
  # ⚠️ 每个**发布服务的行**都必须在这里有对应的键。漏一个，那行就会落到进程全局
  # realm（勘误 §4.4 / E10）：另一个 preset 发布同名服务即冲突，宿主读者也会
  # 解析到"所有会话共用的一个实例"。`scripts/check-preset.mjs` 会静态拦住这种漏项
  # ——它在本 group 合并时就是这么抓到 `ideaScore` 漏声明的。
  isolate:
    projectState: true
    kb: true
    ideaScore: true
  config:
    - id: cvagent-state
      name: cv-agent-dsh/state

    - id: tool-cvagent-state
      name: cv-agent-dsh/state-tools

    - id: cvagent-kb
      name: cv-agent-dsh/kb

    - id: tool-cvagent-kb
      name: cv-agent-dsh/kb-tools

    # P2-6b: cvagent_kb_extract — Reader 子代理委派工具。inject kb + 宿主
    # `tools`，必须与 kb 服务同组（isolate realm）才能解析本项目实例；
    # 子代理经 spawn + toolFilter {read} 做上下文隔离的全文结构化提取。
    - id: tool-cvagent-kb-extract
      name: cv-agent-dsh/kb-extract

    # P3-1: cvagent_kb_upsert_entry / cvagent_kb_search / cvagent_kb_summary —
    # 三库读写面（Analyst 写条目、Orchestrator 检索与总览）。**单列一行**
    # 是为了让角色矩阵能按需授予：Reader 子代理应有读文件 + 结构化输出，
    # 但不该拿到三库写权限。
    - id: tool-cvagent-kb-entries
      name: cv-agent-dsh/kb-entries

    # P3-4: cvagent_kb_scout / cvagent_kb_import_papers / cvagent_kb_analyze —
    # 检索委派（Scout）、批量入库、归纳委派（Analyst）。三者都 inject kb。
    - id: tool-cvagent-kb-research
      name: cv-agent-dsh/kb-research

    # P3-3b: ideaScore 服务 + idea 族工具（生成 / 打分）。
    #
    # `ideaScore` 的状态就是 `kb`（§4.4.1 裁定"无自有状态 + 读 kb"），
    # 必须与 kb 同 realm 才能读到同一个库实例。
    - id: cvagent-idea-score
      name: cv-agent-dsh/idea-score

    - id: tool-cvagent-idea
      name: cv-agent-dsh/idea-tools

    # P3-5: cvagent_domain_bootstrap / _freeze / _propose_revision / _bind —
    # Domain Pack 的生命周期（派生草案 → 人工签名冻结 → 升版本修订 → 项目绑定）。
    # 放在本 group 内：派生要读 kb（论文/提取/四库条目），冻结要写 domain_packs
    # 注册表，而注册表就在同一个 metadata.db 里——注册与落盘必须同处发生，
    # 否则会出现"文件在、注册表没有"的分叉。
    - id: tool-cvagent-domain
      name: cv-agent-dsh/domain-tools

# ── orchestrator execution-level guard (E20) ───────────────────────────────
#
# Provides no service — consumes the host `tools` event surface and the host
# `agents` registry, so it sits OUTSIDE the isolate group (same rule as the
# tool rows inherited from standard). Denies read_*/download_* for the ROOT
# agent only; delegated children remain governed by their toolFilter
# whitelist. See packages/dsh-plugin/src/state/orchestrator-guard.ts.
- id: cvagent-orchestrator-guard
  name: cv-agent-dsh/orchestrator-guard

# ── project conventions (static prompt section) ────────────────────────────
#
# 实验归档与组织原则的**常驻入口**（2026-09-17 用户批准，勘误 §12.4）：
# section 里只放「文档路径 + 三条硬规则 + 校验命令」，长文档留在
# docs/实验归档与组织原则.md。不提供服务，故不需要 isolate realm。
#
# 为什么必须常驻：产物要求是**跨步骤**约束（建目录时要有成功判据、跑完要有
# metrics.json、收敛要写 RESULTS/EVIDENCE）——等 agent 想起来读文档时通常已经漏了。
- id: cvagent-instructions
  name: cv-agent-dsh/instructions

# ── academic retrieval: Asta MCP ────────────────────────────────────────────
#
# Asta is Ai2's Scientific Corpus Tool — the Semantic Scholar graph served at
# <https://asta-tools.allen.ai/mcp/v1> over streamable HTTP, authenticated with
# an `x-api-key` header. dsh ships the bridge (`@deepseek-ai/dsh-mcp-client`);
# it registers every remote tool here as a native tool named
# `mcp__<serverName>__<rawName>`, e.g. `mcp__asta__search_papers_by_relevance`.
# Those names are a pinned contract: they go into `toolFilter` whitelists and
# into session history, and `names.ts` declares them (see ASTA_TOOL_NAMES).
#
# This row sits in the PRESET, not the host composition. The tools land in this
# preset's layer of the host `tools` registry, so this agent sees them and a
# delegated child's `toolFilter` can select them — without putting a retrieval
# surface into every session's catalog. It provides no service, so it needs no
# `isolate` realm (same rule as the tool rows below).
#
# WHY THIS REPLACED dsh-ai4scholar (stopped 2026-09-16): the project needs a
# retrieval backend that is MCP-native. The trade is explicit and already
# reflected in names.ts and the role matrix — Asta has NO full-text/PDF reader
# (paper-fetch skill covers DOI -> PDF; MinerU will cover parsing) and NO
# auto_cite/sci_draw.
#
# ENVIRONMENT — two variables, both required, both easy to miss:
#   1. `ASTA_API_KEY` (read below via `!!js`, never written into this file);
#   2. the host process must start with `HTTPS_PROXY` **and**
#      `NODE_USE_ENV_PROXY=1`. Node 24's global fetch ignores HTTPS_PROXY
#      without that flag, and the MCP transport is fetch-based: measured
#      2026-09-16, proxy-only = 403, proxy + flag = 200. Without both, this
#      row connects to nothing and the agent silently has no search tools.
#
# ⚠️ The `|| 'UNSET'` fallback below is NOT cosmetic. Without it, a missing
# ASTA_API_KEY evaluates to `undefined`, the header value fails the row's
# schema validation, and **the whole preset fails to mount** — E19's rule that
# one bad row takes the mount down applies to CONFIG errors too, not just
# connection errors. Measured 2026-09-16 against the real Config schema:
#   headers: {}                      -> accepted
#   headers: { 'x-api-key': '' }     -> accepted
#   headers: { 'x-api-key': undefined } -> REJECTED
# (The loader's error message renders the offending value with JSON.stringify,
#  which DROPS undefined keys — so it misleadingly reports `headers: {}`, an
#  entirely valid shape. Do not go hunting for an empty-headers bug.)
# With the fallback the config always validates; a missing key then degrades to
# a failed connection, which `failOnStartupError: false` already survives.
#
# `failOnStartupError` is deliberately left at its default (false): with `true`
# a proxy outage would reject this row and take the whole preset's mount down
# with it (E19 showed a single bad row fails the mount). Degrading to "no
# search tools, with an error in the log" is the better failure here.
- id: mcp-asta
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: asta
    transport: streamable-http
    url: https://asta-tools.allen.ai/mcp/v1
    headers:
      # `|| 'UNSET'` 保证值永远是字符串：缺 key 时求值为 undefined 会让整行校验失败，
      # 进而拖垮整个 preset 的挂载（详见上方注释与实测记录）。
      x-api-key: !!js process.env.ASTA_API_KEY || 'UNSET'

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    # Root discovery is decoupled from the session workspace here.
    #
    # By default this provider only scans `<session projectRoot>/.dsh/skills`
    # (rank 100, projectRoot = nearest ancestor with .git, derived from the
    # HOST's cwd). A research project living in another directory therefore
    # gets NO skills at all — silently, with no error. That is the exact
    # failure mode this project refuses to ship, so the two roots below are
    # pinned by environment instead.
    #
    # `customSkillDirs` entries are resolved with `path.resolve(root)`, i.e.
    # against the HOST process's cwd — not the plugin and not the session
    # workspace. scripts/start-dsh-web.ps1 sets both variables to absolute
    # paths AND pins cwd to the repo root, so the env var wins when set and
    # the relative fallback resolves correctly when it is not.
    #
    #   CV_PROJECT_SKILLS_DIR  third-party skills archived in the repo (.dsh/skills)
    #   CV_PLUGIN_SKILLS_DIR   skills owned by this plugin package (packages/dsh-plugin/skills)
    #
    # ⚠️ The `|| '<relative path>'` fallback is NOT cosmetic — never write a bare
    # `!!js process.env.X` here. Measured against the real Config: this schema
    # COERCES an `undefined` entry to `null` and ACCEPTS it, so the failure is
    # not at validation time — the provider's constructor then calls
    # `path.resolve(null)` and throws, which fails the row and takes the whole
    # preset mount down with it. (E22 recorded the same blast radius for
    # mcp-client's `headers`, where `undefined` failed schema validation
    # outright: the mechanism differs, the consequence does not.)
    customSkillDirs:
      - !!js process.env.CV_PROJECT_SKILLS_DIR || '.dsh/skills'
      - !!js process.env.CV_PLUGIN_SKILLS_DIR || 'packages/dsh-plugin/skills'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
