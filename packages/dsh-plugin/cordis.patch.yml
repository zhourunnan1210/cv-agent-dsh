# cv-agent-dsh 的 bundle 层（宿主平面）。
#
# 服务平面归属已裁定（勘误 §4.4.1，2026-09-15）：
#
# - preset 平面的行（projectState / kb / ideaScore 及其工具行）不在这里——
#   它们由 cv-research preset 的组合文件挂载，且必须包在带 `isolate` realm 的
#   group 内（见 docs 勘误 §4.4）。
# - 本文件只承载**宿主平面**的行。当前为空；预期首个入驻的是 expOrchestrator
#   的跨项目资源账本（GPU 实例、预算配额）——它必须是进程单例，否则
#   §4.2 的 C 模式预算护栏会被两个项目各自记账绕过。
#
# 因此本包保留 `dsh.bundle.patch` 声明：`dsh plugin --profile <name> add`
# 会把本包追加进 profile 的 bundle 层栈（当前层为空，等价于仅安装依赖）。
